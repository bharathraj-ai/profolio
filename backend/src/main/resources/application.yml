server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/portfolio}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:portfolio}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change_me_locally}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

